<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">Texas Holdem</title>
  <desc id="description">A gold pair of playing cards on a deep green table.</desc>
  <defs>
    <radialGradient id="felt" cx="38%" cy="28%" r="85%">
      <stop offset="0" stop-color="#174b3a" />
      <stop offset="0.58" stop-color="#0b2b23" />
      <stop offset="1" stop-color="#061712" />
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff0a6" />
      <stop offset="0.48" stop-color="#e8c96b" />
      <stop offset="1" stop-color="#b9872f" />
    </linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="11" stdDeviation="10" flood-color="#000" flood-opacity="0.42" />
    </filter>
  </defs>

