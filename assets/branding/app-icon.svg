    <rect x="29" y="29" width="454" height="454" rx="99" fill="none" stroke="#2b6652" stroke-width="6" />
    <path d="M83 111c84-77 256-91 348 9" fill="none" stroke="#fff" stroke-opacity="0.055" stroke-width="18" stroke-linecap="round" />
  </g>

